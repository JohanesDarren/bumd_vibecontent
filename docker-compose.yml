services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vibecontent
      POSTGRES_USER: vibecontent
      POSTGRES_PASSWORD: vibecontent_dev
    ports:
      - "5435:5432"
    volumes:
      - vibecontent_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibecontent -d vibecontent"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  vibecontent_pgdata:
